<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS & Script file for countdown -->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="script/countdown.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>



    <title>GTA 6 Countdown Timer</title>
</head>
<body id="background-img">
    <div class="container-fluid h-100 d-flex align-items-center justify-content-center">
        <div class="row">
            <div class="container" id="text-stuff">
                <div class="row">
                    <div class="col-3">
                        <div class="card" id="sum-color" style="width: 18rem;">
                            <h5 class="card-header">Day(s)</h5>
                            <div class="card-body">
                                <h5 class="card-text" id="day"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="card" id="sum-color" style="width: 18rem;">
                            <h5 class="card-header">Hour(s)</h5>
                            <div class="card-body">
                                <h5 class="card-text" id="hour"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="card" id="sum-color" style="width: 18rem;">
                            <h5 class="card-header">Minute(s)</h5>
                            <div class="card-body">
                                <h5 class="card-text" id="minute"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="card" id="sum-color" style="width: 18rem;">
                            <h5 class="card-header">Second(s)</h5>
                            <div class="card-body">
                                <h5 class="card-text" id="second"></h5>
                            </div>
                        </div>
                    </div>
                </div>              
            </div>
        </div>
    </div>
</body>
</html>
